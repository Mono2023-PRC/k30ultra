name: Build K30 Ultra Kernel with DroidSpaces + KernelSU

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: 'KernelSU Variant'
        required: true
        default: 'kernelsu'
        type: choice
        options:
          - kernelsu
          - kernelsu-next
          - sukisu-ultra
      kernelsu_ref:
        description: 'KernelSU Branch/Tag (e.g. v0.9.5, main)'
        required: true
        default: 'v0.9.5'
      enable_susfs:
        description: 'Enable SUSFS (NOT recommended for DroidSpaces)'
        required: true
        default: false
        type: boolean

env:
  KERNEL_SOURCE: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
  KERNEL_BRANCH: cezanne-r-oss
  KERNEL_CONFIG: cezanne_defconfig
  ARCH: arm64
  IMAGE_NAME: Image.gz-dtb
  ANYKERNEL_URL: https://github.com/osm0sis/AnyKernel3
  ANYKERNEL_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld make git python3 bc flex bison ccache libelf-dev pahole openssl libssl-dev perl zstd binutils ncurses-dev xz-utils

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_SOURCE }} kernel
          cd kernel
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Setup Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain

          # Clone AOSP Clang (r416183b for Android 12 / compatible with 4.14)
          git clone --depth=1 -b android12-release https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/clang-r416183b clang

          # Clone AOSP GCC for aarch64
          git clone --depth=1 -b android12-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-aarch64

          # Clone AOSP GCC for arm
          git clone --depth=1 -b android12-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc-arm

          echo "TOOLCHAIN_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Setup KernelSU (Non-GKI / kprobe mode)
        run: |
          cd ${{ env.KERNEL_DIR }}

          # 根据选择的变体克隆 KernelSU
          if [ "${{ inputs.kernelsu_variant }}" == "kernelsu" ]; then
            git clone --depth=1 -b ${{ inputs.kernelsu_ref }} https://github.com/tiann/KernelSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "kernelsu-next" ]; then
            git clone --depth=1 -b ${{ inputs.kernelsu_ref }} https://github.com/rifsxd/KernelSU-Next.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "sukisu-ultra" ]; then
            git clone --depth=1 -b ${{ inputs.kernelsu_ref }} https://github.com/ShirkN/SukiSU-Ultra.git KernelSU
          fi

          # 运行 KernelSU 的 setup script
          if [ -f "KernelSU/kernel/setup.sh" ]; then
            bash KernelSU/kernel/setup.sh
          elif [ -f "KernelSU/setup.sh" ]; then
            bash KernelSU/setup.sh
          fi

          echo "KernelSU setup completed"

      - name: Backport path_umount for KernelSU (4.14 required)
        run: |
          cd ${{ env.KERNEL_DIR }}

          # 检查 fs/namespace.c 是否已有 path_umount
          if ! grep -q "path_umount" fs/namespace.c; then
            echo "Backporting path_umount for 4.14 kernel..."

            # 创建 patch 文件
            cat > path_umount.patch << 'PATCH_EOF'
          --- a/fs/namespace.c
          +++ b/fs/namespace.c
          @@ -1739,6 +1739,39 @@ static inline bool may_mandlock(void)
           }
           #endif

          +static int can_umount(const struct path *path, int flags)
          +{
          +	struct mount *mnt = real_mount(path->mnt);
          +
          +	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          +		return -EINVAL;
          +	if (!may_mount())
          +		return -EPERM;
          +	if (path->dentry != path->mnt->mnt_root)
          +		return -EINVAL;
          +	if (!check_mnt(mnt))
          +		return -EINVAL;
          +	if (mnt->mnt.mnt_flags & MNT_LOCKED) /* Check optimistically */
          +		return -EINVAL;
          +	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          +		return -EPERM;
          +	return 0;
          +}
          +
          +int path_umount(struct path *path, int flags)
          +{
          +	struct mount *mnt = real_mount(path->mnt);
          +	int ret;
          +
          +	ret = can_umount(path, flags);
          +	if (!ret)
          +		ret = do_umount(mnt, flags);
          +
          +	/* we mustn't call path_put() as that would clear mnt_expiry_mark */
          +	dput(path->dentry);
          +	mntput_no_expire(mnt);
          +	return ret;
          +}
           /*
            * Now umount can handle mount points as well as block devices.
            * This is important for filesystems which use unnamed block devices.
          PATCH_EOF

            patch -p1 < path_umount.patch || echo "Patch may already be applied or failed, continuing..."
          else
            echo "path_umount already exists, skipping backport"
          fi

      - name: Apply DroidSpaces Kernel Config
        run: |
          cd ${{ env.KERNEL_DIR }}

          # 创建 DroidSpaces 配置片段
          cat > droidspaces.config << 'EOF'
          # ============================================================
          # DroidSpaces Kernel Configuration for Non-GKI (Legacy) Kernels
          # Device: Redmi K30 Ultra (cezanne)
          # Kernel: 4.14
          # Source: https://github.com/ravindu644/Droidspaces-OSS
          # ============================================================

          # IPC mechanisms
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          # Core namespace support
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y

          # Seccomp support
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          # Control groups support
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y

          # Device filesystem support
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y

          # Overlay filesystem support (required for volatile mode)
          CONFIG_OVERLAY_FS=y

          # Enable xattr, posix acl support on tmpfs
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          # Firmware loading support
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          # Droidspaces Network Isolation Support - NAT/none modes
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y

          # legacy compat for 4.14
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y

          # Disable ANDROID_PARANOID_NETWORK on older kernels to make internet work in containers
          # CONFIG_ANDROID_PARANOID_NETWORK is not set

          # Fix for docker unsafe procfs error
          CONFIG_USER_NS=y

          # PTY support
          CONFIG_UNIX98_PTYS=y

          # Loop device support
          CONFIG_BLK_DEV_LOOP=y

          # ext4 support
          CONFIG_EXT4_FS=y

          # KernelSU kprobe support (required for non-GKI)
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          EOF

          # 合并配置到 defconfig
          cat droidspaces.config >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
          echo "DroidSpaces config applied to ${{ env.KERNEL_CONFIG }}"

      - name: Build Kernel
        run: |
          cd ${{ env.KERNEL_DIR }}

          export PATH="${{ env.TOOLCHAIN_DIR }}/clang/bin:${{ env.TOOLCHAIN_DIR }}/gcc-aarch64/bin:${{ env.TOOLCHAIN_DIR }}/gcc-arm/bin:$PATH"

          # 生成 .config
          make O=out ARCH=${{ env.ARCH }} ${{ env.KERNEL_CONFIG }}

          # 编译内核
          make O=out ARCH=${{ env.ARCH }}             CC=clang             CLANG_TRIPLE=aarch64-linux-gnu-             CROSS_COMPILE=aarch64-linux-android-             CROSS_COMPILE_ARM32=arm-linux-androideabi-             -j$(nproc)

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 -b ${{ env.ANYKERNEL_BRANCH }} ${{ env.ANYKERNEL_URL }} anykernel

      - name: Package Kernel with AnyKernel3
        run: |
          cd anykernel

          # 复制编译好的内核镜像
          cp ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/${{ env.IMAGE_NAME }} .

          # 更新 AnyKernel3 的 device 信息
          sed -i 's/do.devicecheck=1/do.devicecheck=1/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=cezanne/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=cezanne/' anykernel.sh

          # 确保 device check 正确
          if ! grep -q "device.name1=cezanne" anykernel.sh; then
            echo "device.name1=cezanne" >> anykernel.sh
            echo "device.name2=cezanne" >> anykernel.sh
          fi

          # 打包为 zip
          zip -r9 K30Ultra-DroidSpaces-KernelSU.zip * -x .git -x README.md -x LICENSE

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: K30Ultra-DroidSpaces-KernelSU
          path: anykernel/K30Ultra-DroidSpaces-KernelSU.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: K30Ultra-DroidSpaces-${{ github.run_number }}
          name: K30 Ultra DroidSpaces + KernelSU Build #${{ github.run_number }}
          body: |
            ## K30 Ultra (cezanne) Kernel with DroidSpaces + KernelSU

            - **Device:** Redmi K30 Ultra (cezanne)
            - **Kernel Version:** 4.14
            - **Android Version:** Android 11 (MIUI 12.5)
            - **KernelSU Variant:** ${{ inputs.kernelsu_variant }}
            - **KernelSU Ref:** ${{ inputs.kernelsu_ref }}
            - **DroidSpaces:** Enabled (Full namespace + network isolation support)

            ### Features
            - Full Linux namespace support (PID, MNT, UTS, IPC, NET, USER, CGROUP)
            - Cgroups v1 support
            - OverlayFS support (volatile mode)
            - Network isolation (NAT / None modes)
            - KernelSU root support (kprobe mode for non-GKI)
            - path_umount backported for KernelSU module unmount

            ### Flashing Instructions
            1. Boot to Recovery (TWRP / OrangeFox recommended)
            2. Flash the zip file
            3. Reboot
            4. Install DroidSpaces APK and run requirements check (`su -c droidspaces check`)

            ### Warning
            - Always backup your current boot partition before flashing!
            - This is an experimental build. Use at your own risk.
          files: anykernel/K30Ultra-DroidSpaces-KernelSU.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
