name: Build K30 Ultra Kernel with DroidSpaces + KernelSU

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: KernelSU variant
        required: true
        default: kernelsu
        type: choice
        options:
          - kernelsu
          - kernelsu-next
          - sukisu-ultra
      kernelsu_ref:
        description: KernelSU branch or tag; KernelSU Next 4.14 normally uses legacy
        required: true
        default: main
        type: string
      enable_susfs:
        description: Enable SUSFS patches (not recommended for DroidSpaces)
        required: true
        default: false
        type: boolean
      cache_buster:
        description: Change this value to force re-downloading kernel source and toolchains
        required: true
        default: v1
        type: string

permissions:
  contents: write

env:
  DEVICE: cezanne
  ARCH: arm64
  SUBARCH: arm64
  KERNEL_BRANCH: cezanne-r-oss
  DEFCONFIG: cezanne_user_defconfig
  OUT_DIR: out
  CLANG_VERSION: clang-r416183b
  DOWNLOAD_CACHE_DIR: .cache/downloads

jobs:
  build:
    name: Build DroidSpaces KernelSU kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git jq libelf-dev \
            libssl-dev lz4 python3 unzip wget zip

      - name: Restore downloaded sources and toolchains cache
        id: download-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.DOWNLOAD_CACHE_DIR }}
            toolchains
          key: k30ultra-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-${{ env.CLANG_VERSION }}-${{ inputs.cache_buster }}

      - name: Download kernel source
        run: |
          set -euo pipefail
          mkdir -p "${DOWNLOAD_CACHE_DIR}" kernel
          kernel_tar="${DOWNLOAD_CACHE_DIR}/xiaomi-${KERNEL_BRANCH}.tar.gz"

          if [ ! -s "${kernel_tar}" ]; then
            wget -qO "${kernel_tar}" \
              "https://github.com/MiCode/Xiaomi_Kernel_OpenSource/archive/refs/heads/${KERNEL_BRANCH}.tar.gz"
          else
            echo "Using cached kernel source archive: ${kernel_tar}"
          fi

          rm -rf kernel
          mkdir -p kernel
          tar -xf "${kernel_tar}" --strip-components=1 -C kernel

      - name: Download Android toolchains
        run: |
          set -euo pipefail
          mkdir -p "${DOWNLOAD_CACHE_DIR}" toolchains

          clang_tar="${DOWNLOAD_CACHE_DIR}/${CLANG_VERSION}.tar.gz"
          aarch64_gcc_tar="${DOWNLOAD_CACHE_DIR}/aarch64-linux-android-4.9-android12-release.tar.gz"
          arm_gcc_tar="${DOWNLOAD_CACHE_DIR}/arm-linux-androideabi-4.9-android12-release.tar.gz"

          if [ ! -s "${clang_tar}" ]; then
            wget -qO "${clang_tar}" \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/${CLANG_VERSION}.tar.gz"
          else
            echo "Using cached clang archive: ${clang_tar}"
          fi

          if [ ! -s "${aarch64_gcc_tar}" ]; then
            wget -qO "${aarch64_gcc_tar}" \
              "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android12-release.tar.gz"
          else
            echo "Using cached aarch64 GCC archive: ${aarch64_gcc_tar}"
          fi

          if [ ! -s "${arm_gcc_tar}" ]; then
            wget -qO "${arm_gcc_tar}" \
              "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/android12-release.tar.gz"
          else
            echo "Using cached arm GCC archive: ${arm_gcc_tar}"
          fi

          if [ ! -x toolchains/clang/bin/clang ]; then
            rm -rf toolchains/clang
            mkdir -p toolchains/clang
            tar -xf "${clang_tar}" -C toolchains/clang
          fi

          if [ ! -x toolchains/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc ]; then
            rm -rf toolchains/aarch64-linux-android-4.9
            mkdir -p toolchains/aarch64-linux-android-4.9
            tar -xf "${aarch64_gcc_tar}" -C toolchains/aarch64-linux-android-4.9
          fi

          if [ ! -x toolchains/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-gcc ]; then
            rm -rf toolchains/arm-linux-androideabi-4.9
            mkdir -p toolchains/arm-linux-androideabi-4.9
            tar -xf "${arm_gcc_tar}" -C toolchains/arm-linux-androideabi-4.9
          fi

      - name: Save downloaded sources and toolchains cache
        if: steps.download-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ${{ env.DOWNLOAD_CACHE_DIR }}
            toolchains
          key: ${{ steps.download-cache.outputs.cache-primary-key }}

      - name: Prepare source patches
        working-directory: kernel
        run: |
          set -euo pipefail

          if grep -RIl "static inline.*mt_get_uartlog_status" . | xargs -r sed -i 's/static inline \([a-zA-Z_][a-zA-Z0-9_[:space:]*]*mt_get_uartlog_status[[:space:]]*(\)/inline \1/g'; then
            echo "Applied MTK UART log declaration compatibility patch."
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("drivers/gpu/drm/mediatek/mtk_drm_crtc.c")
          if path.exists():
              text = path.read_text()

              def fix_cmdq_log(match):
                  block = match.group(0)
                  if "cmdq_handle" not in block:
                      return block
                  block = block.replace("0x%x", "%p")
                  block = block.replace("%x", "%p")
                  block = block.replace("(unsigned int)*cmdq_handle", "*cmdq_handle")
                  return block

              text = re.sub(r"DDPPR_ERR\([\s\S]*?\);", fix_cmdq_log, text)
              path.write_text(text)
          PY

          if ! grep -R "path_umount" -n fs/namespace.c >/dev/null; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path("fs/namespace.c")
          text = path.read_text()

          marker = "SYSCALL_DEFINE2(umount"
          func = r'''
          static int can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);

          	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		return -EINVAL;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		return -EPERM;
          	return 0;
          }

          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int retval;

          	retval = can_umount(path, flags);
          	if (!retval)
          		retval = do_umount(mnt, flags);

          	/* We must not call path_put(), because that would clear mnt_expiry_mark. */
          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return retval;
          }
          EXPORT_SYMBOL(path_umount);

          '''
          if marker not in text:
              raise SystemExit("Cannot find umount syscall marker in fs/namespace.c")

          path.write_text(text.replace(marker, func + marker, 1))
          PY
          fi

      - name: Restore SELinux generated headers for KernelSU compatibility
        working-directory: kernel
        run: |
          set -euo pipefail
          mkdir -p security/selinux/include

          if [ ! -s security/selinux/include/classmap.h ]; then
            wget -qO security/selinux/include/classmap.h \
              "https://raw.githubusercontent.com/torvalds/linux/v5.4/security/selinux/include/classmap.h"
          fi
          if [ ! -s security/selinux/include/initial_sid_to_string.h ]; then
            wget -qO security/selinux/include/initial_sid_to_string.h \
              "https://raw.githubusercontent.com/torvalds/linux/v5.4/security/selinux/include/initial_sid_to_string.h"
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path("security/selinux/include/classmap.h")
          text = path.read_text()

          text = text.replace("#include <linux/capability.h>\n#include <linux/socket.h>\n\n", "")
          text = text.replace(
              "#if CAP_LAST_CAP > CAP_CHECKPOINT_RESTORE\n"
              "#error New capability defined, please update COMMON_CAP2_PERMS.\n"
              "#endif\n\n",
              "",
          )
          text = text.replace(
              "#if PF_MAX > 46\n"
              "#error New address family defined, please update secclass_map.\n"
              "#endif\n",
              "#ifdef __KERNEL__\n"
              "#include <linux/capability.h>\n"
              "#if CAP_LAST_CAP > CAP_CHECKPOINT_RESTORE\n"
              "#error New capability defined, please update COMMON_CAP2_PERMS.\n"
              "#endif\n"
              "#include <linux/socket.h>\n"
              "#if PF_MAX > 46\n"
              "#error New address family defined, please update secclass_map.\n"
              "#endif\n"
              "#endif\n",
          )

          path.write_text(text)
          PY

          if [ ! -s security/selinux/include/flask.h ] || [ ! -s security/selinux/include/av_permissions.h ]; then
            gcc -Isecurity/selinux/include \
              scripts/selinux/genheaders/genheaders.c \
              -o /tmp/selinux-genheaders
            /tmp/selinux-genheaders \
              security/selinux/include/flask.h \
              security/selinux/include/av_permissions.h
          fi

          if ! grep -R "SECINITSID_NUM" -n security/selinux/include >/dev/null; then
            sid_count="$(grep -E '^[[:space:]]*"[a-zA-Z0-9_]+",[[:space:]]*$' security/selinux/include/initial_sid_to_string.h | wc -l)"
            {
              echo ""
              echo "#ifndef SECINITSID_NUM"
              echo "#define SECINITSID_NUM ${sid_count}"
              echo "#endif"
            } >> security/selinux/include/flask.h
          fi

          if ! grep -R "SIDTAB_HASH_BITS" -n security/selinux >/dev/null; then
            {
              echo ""
              echo "#ifndef SIDTAB_HASH_BITS"
              echo "#define SIDTAB_HASH_BITS 7"
              echo "#endif"
            } >> security/selinux/ss/sidtab.h
          fi

      - name: Integrate KernelSU
        working-directory: kernel
        env:
          KSU_VARIANT: ${{ inputs.kernelsu_variant }}
          KSU_REF: ${{ inputs.kernelsu_ref }}
        run: |
          set -euo pipefail
          case "${KSU_VARIANT}" in
            kernelsu)
              setup_url="https://raw.githubusercontent.com/tiann/KernelSU/${KSU_REF}/kernel/setup.sh"
              ;;
            kernelsu-next)
              setup_url="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
              ;;
            sukisu-ultra)
              setup_url="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${KSU_REF}/kernel/setup.sh"
              ;;
            *)
              echo "Unknown KernelSU variant: ${KSU_VARIANT}" >&2
              exit 1
              ;;
          esac

          setup_ref="${KSU_REF}"
          if [ "${KSU_VARIANT}" = "kernelsu-next" ] && [ "${setup_ref}" = "main" ]; then
            setup_ref="legacy"
          fi

          curl -LSs "${setup_url}" | bash -s "${setup_ref}"

      - name: Patch KernelSU for Linux 4.14 compatibility
        working-directory: kernel
        run: |
          set -euo pipefail

          if grep -R "MODULE_IMPORT_NS(" -n drivers/kernelsu >/dev/null 2>&1; then
            grep -RIl "MODULE_IMPORT_NS(" drivers/kernelsu | xargs -r sed -i '/MODULE_IMPORT_NS(/d'
          fi

          if [ -f drivers/kernelsu/hook/syscall_hook.h ] && \
             grep -q "syscall_fn_t" drivers/kernelsu/hook/syscall_hook.h && \
             ! grep -q "typedef .*syscall_fn_t" drivers/kernelsu/hook/syscall_hook.h; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path("drivers/kernelsu/hook/syscall_hook.h")
          text = path.read_text()
          compat = """
          #ifndef KSU_414_SYSCALL_FN_T_COMPAT
          #define KSU_414_SYSCALL_FN_T_COMPAT
          struct pt_regs;
          typedef long (*syscall_fn_t)(const struct pt_regs *);
          #endif

          """

          if "KSU_414_SYSCALL_FN_T_COMPAT" not in text:
              if "#pragma once" in text:
                  text = text.replace("#pragma once\n", "#pragma once\n" + compat, 1)
              else:
                  text = compat + text
              path.write_text(text)
          PY
          fi

      - name: Configure DroidSpaces kernel options
        working-directory: kernel
        env:
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
        run: |
          set -euo pipefail

          export PATH="${GITHUB_WORKSPACE}/toolchains/clang/bin:${GITHUB_WORKSPACE}/toolchains/aarch64-linux-android-4.9/bin:${GITHUB_WORKSPACE}/toolchains/arm-linux-androideabi-4.9/bin:${PATH}"
          if [ ! -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            if [ -f arch/arm64/configs/cezanne_user_defconfig ]; then
              DEFCONFIG=cezanne_user_defconfig
            elif [ -f arch/arm64/configs/k6889v1_64_defconfig ]; then
              DEFCONFIG=k6889v1_64_defconfig
            else
              echo "Available arm64 defconfigs:"
              find arch/arm64/configs -maxdepth 1 -name '*defconfig' -printf '%f\n' | sort
              exit 1
            fi
          fi
          echo "Using defconfig: ${DEFCONFIG}"
          make O="${OUT_DIR}" ARCH=arm64 "${DEFCONFIG}"

          cfg="${OUT_DIR}/.config"
          cfg_set() {
            if [ -x scripts/config ]; then
              scripts/config --file "${cfg}" -e "$1"
            else
              sed -i "/^# CONFIG_$1 is not set/d;/^CONFIG_$1=/d" "${cfg}"
              echo "CONFIG_$1=y" >> "${cfg}"
            fi
          }
          cfg_unset() {
            if [ -x scripts/config ]; then
              scripts/config --file "${cfg}" -d "$1"
            else
              sed -i "/^# CONFIG_$1 is not set/d;/^CONFIG_$1=/d" "${cfg}"
              echo "# CONFIG_$1 is not set" >> "${cfg}"
            fi
          }

          for opt in \
            IKCONFIG IKCONFIG_PROC MODULES KALLSYMS KALLSYMS_ALL \
            KSU KSU_KPROBE_HOOKS KPROBES HAVE_KPROBES KPROBE_EVENTS TRACEPOINTS \
            AUDIT SECURITY SECURITYFS SECURITY_NETWORK SECURITY_PATH \
            SECURITY_SELINUX SECURITY_SELINUX_AVC_STATS DEFAULT_SECURITY_SELINUX \
            NO_HZ_COMMON \
            NAMESPACES PID_NS UTS_NS IPC_NS USER_NS NET_NS \
            CGROUPS CGROUP_DEVICE CGROUP_PIDS MEMCG CGROUP_SCHED FAIR_GROUP_SCHED CFS_BANDWIDTH FREEZER \
            CGROUP_NET_PRIO CGROUP_NET_CLASSID NET_CLS_CGROUP \
            OVERLAY_FS DEVTMPFS DEVTMPFS_MOUNT BLK_DEV_LOOP \
            NET INET VETH BRIDGE TUN DUMMY IPVLAN MACVLAN \
            NETFILTER NF_CONNTRACK NF_NAT NF_TABLES \
            IP_NF_IPTABLES IP_NF_FILTER IP_NF_NAT IP_NF_TARGET_MASQUERADE \
            NETFILTER_XTABLES NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_MATCH_CONNTRACK \
            NETFILTER_XT_MATCH_OWNER NETFILTER_XT_MATCH_STATE NETFILTER_XT_TARGET_MASQUERADE; do
            cfg_set "${opt}"
          done

          cfg_unset ANDROID_PARANOID_NETWORK
          cfg_unset SECURITY_SELINUX_DISABLE
          cfg_unset SECURITY_SELINUX_BOOTPARAM
          cfg_unset DEFAULT_SECURITY_DAC

          if [ "${ENABLE_SUSFS}" != "true" ]; then
            cfg_unset KSU_SUSFS
            cfg_unset KSU_SUSFS_HAS_MAGIC_MOUNT
            cfg_unset KSU_SUSFS_SUS_PATH
            cfg_unset KSU_SUSFS_SUS_MOUNT
            cfg_unset KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
            cfg_unset KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
            cfg_unset KSU_SUSFS_SUS_KSTAT
            cfg_unset KSU_SUSFS_TRY_UMOUNT
            cfg_unset KSU_SUSFS_SPOOF_UNAME
          fi

          for opt in \
            LTO LTO_CLANG LTO_CLANG_FULL LTO_CLANG_THIN THINLTO \
            CFI_CLANG CFI_PERMISSIVE SHADOW_CALL_STACK \
            LD_DEAD_CODE_DATA_ELIMINATION WERROR CC_WERROR; do
            cfg_unset "${opt}"
          done

          if [ -x scripts/config ]; then
            scripts/config --file "${cfg}" --set-str DEFAULT_SECURITY selinux || true
          else
            sed -i '/^CONFIG_DEFAULT_SECURITY=/d' "${cfg}"
            echo 'CONFIG_DEFAULT_SECURITY="selinux"' >> "${cfg}"
          fi

          make O="${OUT_DIR}" ARCH=arm64 olddefconfig \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            KCFLAGS="-Wno-error=pointer-to-int-cast -Wno-error=int-to-pointer-cast" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

          grep -E 'CONFIG_(SECURITY|SECURITY_SELINUX|KSU)=' "${cfg}" || true
          grep -q '^CONFIG_AUDIT=y' "${cfg}"
          grep -q '^CONFIG_NET=y' "${cfg}"
          grep -q '^CONFIG_INET=y' "${cfg}"
          grep -q '^CONFIG_SECURITY=y' "${cfg}"
          grep -q '^CONFIG_SECURITY_SELINUX=y' "${cfg}"

      - name: Build kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/toolchains/clang/bin:${GITHUB_WORKSPACE}/toolchains/aarch64-linux-android-4.9/bin:${GITHUB_WORKSPACE}/toolchains/arm-linux-androideabi-4.9/bin:${PATH}"
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions
          make -j"$(nproc)" O="${OUT_DIR}" ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            KCFLAGS="-Wno-error=pointer-to-int-cast -Wno-error=int-to-pointer-cast" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package with AnyKernel3
        run: |
          set -euo pipefail
          wget -qO anykernel.tar.gz "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.tar.gz"
          mkdir -p AnyKernel3
          tar -xf anykernel.tar.gz --strip-components=1 -C AnyKernel3
          rm -rf AnyKernel3/.git* AnyKernel3/README.md

          image="kernel/${OUT_DIR}/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "${image}" ]; then
            image="kernel/${OUT_DIR}/arch/arm64/boot/Image.gz"
          fi
          if [ ! -f "${image}" ]; then
            image="kernel/${OUT_DIR}/arch/arm64/boot/Image"
          fi
          cp "${image}" AnyKernel3/

          sed -i 's/^device.name1=.*/device.name1=cezanne/' AnyKernel3/anykernel.sh || true
          sed -i 's/^device.name2=.*/device.name2=Redmi K30 Ultra/' AnyKernel3/anykernel.sh || true
          sed -i 's/^supported.versions=.*/supported.versions=11/' AnyKernel3/anykernel.sh || true

          cd AnyKernel3
          zip -r9 "../K30Ultra-DroidSpaces-KernelSU.zip" ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: K30Ultra-DroidSpaces-KernelSU
          path: K30Ultra-DroidSpaces-KernelSU.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: k30ultra-droidspaces-${{ github.run_number }}
          name: K30 Ultra DroidSpaces KernelSU ${{ github.run_number }}
          files: K30Ultra-DroidSpaces-KernelSU.zip
          prerelease: true
