name: Build K30 Ultra Kernel with DroidSpaces + KernelSU

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: 'KernelSU Variant'
        required: true
        default: 'kernelsu'
        type: choice
        options:
          - kernelsu
          - kernelsu-next
          - sukisu-ultra
      kernelsu_ref:
        description: 'KernelSU Branch/Tag (e.g. v0.9.5, main)'
        required: true
        default: 'v0.9.5'
      enable_susfs:
        description: 'Enable SUSFS (NOT recommended for DroidSpaces)'
        required: true
        default: false
        type: boolean

env:
  KERNEL_SOURCE: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
  KERNEL_BRANCH: cezanne-r-oss
  KERNEL_CONFIG: cezanne_defconfig
  ARCH: arm64
  IMAGE_NAME: Image.gz-dtb
  ANYKERNEL_URL: https://github.com/osm0sis/AnyKernel3
  ANYKERNEL_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld make git python3 bc flex bison ccache libelf-dev pahole openssl libssl-dev perl zstd binutils ncurses-dev xz-utils

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_SOURCE }} kernel
          cd kernel
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Download Toolchains
        run: |
          mkdir -p toolchain
          cd toolchain

          echo "Downloading AOSP Clang r416183b..."
          wget -q --show-progress \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.1.0_r1/clang-r416183b.tar.gz" \
            -O clang-r416183b.tar.gz
          mkdir -p clang
          tar -xzf clang-r416183b.tar.gz -C clang
          rm clang-r416183b.tar.gz

          echo "Downloading AOSP GCC aarch64..."
          wget -q --show-progress \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" \
            -O gcc-aarch64.tar.gz
          mkdir -p gcc-aarch64
          tar -xzf gcc-aarch64.tar.gz -C gcc-aarch64
          rm gcc-aarch64.tar.gz

          echo "Downloading AOSP GCC arm..."
          wget -q --show-progress \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" \
            -O gcc-arm.tar.gz
          mkdir -p gcc-arm
          tar -xzf gcc-arm.tar.gz -C gcc-arm
          rm gcc-arm.tar.gz

          echo "TOOLCHAIN_DIR=$(pwd)" >> $GITHUB_ENV
          echo "Toolchains downloaded successfully!"

      - name: Fix MTK printk header conflict (Clang compatibility)
        run: |
          cd ${{ env.KERNEL_DIR }}

          MTK_PRINTK_H="drivers/misc/mediatek/include/mt-plat/mtk_printk_ctrl.h"
          if [ -f "$MTK_PRINTK_H" ]; then
            echo "Fixing mtk_printk_ctrl.h static declaration conflict..."
            sed -i 's/static inline bool mt_get_uartlog_status/inline bool mt_get_uartlog_status/' "$MTK_PRINTK_H"
            echo "Fixed: $(grep -n 'mt_get_uartlog_status' $MTK_PRINTK_H || echo 'pattern not found')"
          fi

          PRINTK_H="include/linux/printk.h"
          if [ -f "$PRINTK_H" ]; then
            echo "printk.h declaration: $(grep -n 'mt_get_uartlog_status' $PRINTK_H || echo 'not found')"
          fi

      - name: Setup KernelSU (Non-GKI / kprobe mode)
        run: |
          cd ${{ env.KERNEL_DIR }}

          if [ "${{ inputs.kernelsu_variant }}" == "kernelsu" ]; then
            git clone --depth=1 -b ${{ inputs.kernelsu_ref }} https://github.com/tiann/KernelSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "kernelsu-next" ]; then
            git clone --depth=1 -b ${{ inputs.kernelsu_ref }} https://github.com/rifsxd/KernelSU-Next.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "sukisu-ultra" ]; then
            git clone --depth=1 -b ${{ inputs.kernelsu_ref }} https://github.com/ShirkN/SukiSU-Ultra.git KernelSU
          fi

          if [ -f "KernelSU/kernel/setup.sh" ]; then
            bash KernelSU/kernel/setup.sh
          elif [ -f "KernelSU/setup.sh" ]; then
            bash KernelSU/setup.sh
          fi

          echo "KernelSU setup completed"

      - name: Fix missing SELinux headers
        run: |
          cd ${{ env.KERNEL_DIR }}

          mkdir -p security/selinux/include

          UPSTREAM_BASE="https://raw.githubusercontent.com/torvalds/linux/v5.4/security/selinux/include"

          for f in classmap.h initial_sid_to_string.h flask.h av_permissions.h; do
            if [ ! -f "security/selinux/include/$f" ]; then
              echo "Downloading $f from Linux 5.4 LTS..."
              wget -q "$UPSTREAM_BASE/$f" -O "security/selinux/include/$f" || echo "WARNING: failed to download $f"
            else
              echo "$f already exists"
            fi
          done

          for f in flask.h av_permissions.h; do
            if [ -f "security/selinux/include/$f" ] && [ ! -f "security/selinux/$f" ]; then
              cp "security/selinux/include/$f" "security/selinux/$f"
            fi
          done

          echo "SELinux include directory contents:"
          ls -la security/selinux/include/ || true

      - name: Fix backported SELinux sidtab for 4.14
        run: |
          cd ${{ env.KERNEL_DIR }}

          # Count initial SIDs from initial_sid_to_string.h (lines containing quoted strings)
          NUM=$(grep -c '"' security/selinux/include/initial_sid_to_string.h || echo 0)
          echo "Computed SECINITSID_NUM = $NUM"

          # Append to flask.h
          echo "" >> security/selinux/include/flask.h
          echo "#define SECINITSID_NUM $NUM" >> security/selinux/include/flask.h

          if [ -f "security/selinux/flask.h" ]; then
            echo "" >> security/selinux/flask.h
            echo "#define SECINITSID_NUM $NUM" >> security/selinux/flask.h
          fi

          # Fix sidtab.h - replace Kconfig-dependent macro with literal
          sed -i 's/#define SIDTAB_HASH_BITS CONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS/#define SIDTAB_HASH_BITS 9/' security/selinux/ss/sidtab.h
          echo "Fixed sidtab.h: SIDTAB_HASH_BITS = 9"

      - name: Backport path_umount for KernelSU (4.14 required)
        run: |
          cd ${{ env.KERNEL_DIR }}

          if ! grep -q "path_umount" fs/namespace.c; then
            echo "Backporting path_umount for 4.14 kernel..."

            python3 -c "import sys; lines = open('fs/namespace.c').readlines(); idx = next((i for i, l in enumerate(lines) if 'SYSCALL_DEFINE2(umount' in l), None); exit(1) if idx is None else None; code = 'static int can_umount(const struct path *path, int flags)\n{\n\tstruct mount *mnt = real_mount(path->mnt);\n\n\tif (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))\n\t\treturn -EINVAL;\n\tif (!may_mount())\n\t\treturn -EPERM;\n\tif (path->dentry != path->mnt->mnt_root)\n\t\treturn -EINVAL;\n\tif (!check_mnt(mnt))\n\t\treturn -EINVAL;\n\tif (mnt->mnt.mnt_flags & MNT_LOCKED)\n\t\treturn -EINVAL;\n\tif (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))\n\t\treturn -EPERM;\n\treturn 0;\n}\n\nint path_umount(struct path *path, int flags)\n{\n\tstruct mount *mnt = real_mount(path->mnt);\n\tint ret;\n\n\tret = can_umount(path, flags);\n\tif (!ret)\n\t\tret = do_umount(mnt, flags);\n\n\t/* we must not call path_put() as that would clear mnt_expiry_mark */\n\tdput(path->dentry);\n\tmntput_no_expire(mnt);\n\treturn ret;\n}\n\n'; lines.insert(idx, code); open('fs/namespace.c', 'w').writelines(lines); print('path_umount backported successfully')"
          else
            echo "path_umount already exists, skipping backport"
          fi

      - name: Apply DroidSpaces Kernel Config
        run: |
          cd ${{ env.KERNEL_DIR }}

          cat > droidspaces.config << 'EOF'
          # ============================================================
          # DroidSpaces Kernel Configuration for Non-GKI (Legacy) Kernels
          # Device: Redmi K30 Ultra (cezanne)
          # Kernel: 4.14
          # ============================================================

          # NO_HZ support (required for KernelSU on 4.14)
          # CONFIG_HZ_PERIODIC is not set
          CONFIG_NO_HZ_IDLE=y
          CONFIG_NO_HZ_COMMON=y

          # SELinux sidtab hash table (backported in cezanne-r-oss)
          CONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS=9
          CONFIG_SECURITY_SELINUX_SID2STR_CACHE_SIZE=256

          # IPC mechanisms
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          # Core namespace support
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y

          # Seccomp support
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          # Control groups support
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y

          # Device filesystem support
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y

          # Overlay filesystem support (required for volatile mode)
          CONFIG_OVERLAY_FS=y

          # Enable xattr, posix acl support on tmpfs
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          # Firmware loading support
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          # Droidspaces Network Isolation Support - NAT/none modes
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y

          # legacy compat for 4.14
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y

          # Disable ANDROID_PARANOID_NETWORK on older kernels to make internet work in containers
          # CONFIG_ANDROID_PARANOID_NETWORK is not set

          # Fix for docker unsafe procfs error
          CONFIG_USER_NS=y

          # PTY support
          CONFIG_UNIX98_PTYS=y

          # Loop device support
          CONFIG_BLK_DEV_LOOP=y

          # ext4 support
          CONFIG_EXT4_FS=y

          # KernelSU kprobe support (required for non-GKI)
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          EOF

          cat droidspaces.config >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
          echo "DroidSpaces config applied to ${{ env.KERNEL_CONFIG }}"

      - name: Build Kernel
        run: |
          cd ${{ env.KERNEL_DIR }}

          export PATH="${{ env.TOOLCHAIN_DIR }}/clang/bin:${{ env.TOOLCHAIN_DIR }}/gcc-aarch64/bin:${{ env.TOOLCHAIN_DIR }}/gcc-arm/bin:$PATH"

          make O=out ARCH=${{ env.ARCH }} ${{ env.KERNEL_CONFIG }}

          make O=out ARCH=${{ env.ARCH }} \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            -j$(nproc)

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 -b ${{ env.ANYKERNEL_BRANCH }} ${{ env.ANYKERNEL_URL }} anykernel

      - name: Package Kernel with AnyKernel3
        run: |
          cd anykernel

          cp ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/${{ env.IMAGE_NAME }} .

          sed -i 's/do.devicecheck=1/do.devicecheck=1/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=cezanne/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=cezanne/' anykernel.sh

          if ! grep -q "device.name1=cezanne" anykernel.sh; then
            echo "device.name1=cezanne" >> anykernel.sh
            echo "device.name2=cezanne" >> anykernel.sh
          fi

          zip -r9 K30Ultra-DroidSpaces-KernelSU.zip * -x .git -x README.md -x LICENSE

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: K30Ultra-DroidSpaces-KernelSU
          path: anykernel/K30Ultra-DroidSpaces-KernelSU.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: K30Ultra-DroidSpaces-${{ github.run_number }}
          name: K30 Ultra DroidSpaces + KernelSU Build #${{ github.run_number }}
          body: |
            ## K30 Ultra (cezanne) Kernel with DroidSpaces + KernelSU

            - **Device:** Redmi K30 Ultra (cezanne)
            - **Kernel Version:** 4.14
            - **Android Version:** Android 11 (MIUI 12.5)
            - **KernelSU Variant:** ${{ inputs.kernelsu_variant }}
            - **KernelSU Ref:** ${{ inputs.kernelsu_ref }}
            - **DroidSpaces:** Enabled (Full namespace + network isolation support)

            ### Features
            - Full Linux namespace support (PID, MNT, UTS, IPC, NET, USER, CGROUP)
            - Cgroups v1 support
            - OverlayFS support (volatile mode)
            - Network isolation (NAT / None modes)
            - KernelSU root support (kprobe mode for non-GKI)
            - path_umount backported for KernelSU module unmount

            ### Flashing Instructions
            1. Boot to Recovery (TWRP / OrangeFox recommended)
            2. Flash the zip file
            3. Reboot
            4. Install DroidSpaces APK and run requirements check (`su -c droidspaces check`)

            ### Warning
            - Always backup your current boot partition before flashing!
            - This is an experimental build. Use at your own risk.
          files: anykernel/K30Ultra-DroidSpaces-KernelSU.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
